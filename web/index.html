<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0066FF">
  <title>경건생활 점검</title>
  <!-- 표지 제목용 세리프 (출석부 표지 시안 동일) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="경건생활">
  <script>
    // 첫 페인트 전에 저장된 테마 적용 (FOUC 방지)
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js" crossorigin></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <style>
    /* ============================================================
       Montage Design System (WDS) — 경건생활 점검 적용
       출석부(youth_group)의 tokens + components inline 복제 (R9).
       출석 5색(--att-*) 대신 경건생활 4색(--dev-*)으로 매핑.
       ============================================================ */

    /* ── Montage atomic + semantic + type + space + radius + shadow tokens ── */
    :root {
      /* Common */
      --atomic-common-0: #000000; --atomic-common-100: #ffffff;

      /* Cool Neutral */
      --atomic-coolNeutral-5: #0F0F10; --atomic-coolNeutral-7: #141415; --atomic-coolNeutral-10: #171719;
      --atomic-coolNeutral-15: #1B1C1E; --atomic-coolNeutral-17: #212225; --atomic-coolNeutral-20: #292A2D;
      --atomic-coolNeutral-22: #2E2F33; --atomic-coolNeutral-23: #333438; --atomic-coolNeutral-25: #37383C;
      --atomic-coolNeutral-30: #46474C; --atomic-coolNeutral-40: #5A5C63; --atomic-coolNeutral-50: #70737C;
      --atomic-coolNeutral-60: #878A93; --atomic-coolNeutral-70: #989BA2; --atomic-coolNeutral-80: #AEB0B6;
      --atomic-coolNeutral-90: #C2C4C8; --atomic-coolNeutral-95: #DBDCDF; --atomic-coolNeutral-96: #E1E2E4;
      --atomic-coolNeutral-97: #EAEBEC; --atomic-coolNeutral-98: #F4F4F5; --atomic-coolNeutral-99: #F7F7F8;

      /* Blue — brand */
      --atomic-blue-10:#001536; --atomic-blue-20:#002966; --atomic-blue-30:#003E9C; --atomic-blue-40:#0054D1;
      --atomic-blue-45:#005EEB; --atomic-blue-50:#0066FF; --atomic-blue-55:#1A75FF; --atomic-blue-60:#3385FF;
      --atomic-blue-65:#4F95FF; --atomic-blue-70:#69A5FF; --atomic-blue-80:#9EC5FF; --atomic-blue-90:#C9DEFE;
      --atomic-blue-95:#EAF2FE; --atomic-blue-99:#F7FBFF;

      /* Status atomics */
      --atomic-red-10:#3B0101; --atomic-red-40:#E52222; --atomic-red-50:#FF4242; --atomic-red-60:#FF6363;
      --atomic-red-90:#FED5D5; --atomic-red-95:#FEECEC;
      --atomic-green-10:#00240C; --atomic-green-40:#009632; --atomic-green-50:#00BF40; --atomic-green-60:#1ED45A;
      --atomic-green-90:#ACFCC7; --atomic-green-95:#D9FFE6;
      --atomic-orange-10:#361E00; --atomic-orange-39:#D17600; --atomic-orange-50:#FF9200; --atomic-orange-60:#FFA938;
      --atomic-orange-90:#FEE6C6; --atomic-orange-95:#FEF4E6;

      /* Accent palette */
      --atomic-redOrange-48:#F55A00; --atomic-redOrange-50:#FF5E00; --atomic-redOrange-60:#FF7B2E;
      --atomic-lime-37:#429E00; --atomic-lime-50:#58CF04; --atomic-lime-60:#6BE016;
      --atomic-cyan-40:#0098B2; --atomic-cyan-50:#00BDDE; --atomic-cyan-60:#28D0ED;
      --atomic-lightBlue-40:#008DCF; --atomic-lightBlue-50:#00AEFF; --atomic-lightBlue-60:#3DC2FF;
      --atomic-violet-45:#5B37ED; --atomic-violet-50:#6541F2; --atomic-violet-60:#7D5EF7; --atomic-violet-70:#9E86FC;
      --atomic-purple-40:#AD36E3; --atomic-purple-50:#CB59FF; --atomic-purple-60:#D478FF;
      --atomic-pink-46:#E846CD; --atomic-pink-50:#F553DA; --atomic-pink-60:#FA73E3;

      /* Semantic — Light */
      --semantic-static-white:#ffffff; --semantic-static-black:#000000;
      --semantic-primary-normal:#0066FF; --semantic-primary-strong:#005EEB; --semantic-primary-heavy:#0054D1;
      --semantic-label-normal:#171719; --semantic-label-strong:#000000;
      --semantic-label-neutral:rgba(46,47,51,0.88); --semantic-label-alternative:rgba(55,56,60,0.61);
      --semantic-label-assistive:rgba(55,56,60,0.28); --semantic-label-disable:rgba(55,56,60,0.16);
      --semantic-background-normal-normal:#ffffff; --semantic-background-normal-alternative:#F7F7F8;
      --semantic-background-elevated-normal:#ffffff; --semantic-background-elevated-alternative:#F7F7F8;
      --semantic-background-transparent-normal:rgba(255,255,255,0.08);
      --semantic-background-transparent-alternative:rgba(255,255,255,0.28);
      --semantic-interaction-inactive:#989BA2; --semantic-interaction-disable:#F4F4F5;
      --semantic-line-normal-normal:rgba(112,115,124,0.22);
      --semantic-line-normal-neutral:rgba(112,115,124,0.16);
      --semantic-line-normal-alternative:rgba(112,115,124,0.08);
      --semantic-line-solid-normal:#E1E2E4; --semantic-line-solid-neutral:#EAEBEC; --semantic-line-solid-alternative:#F4F4F5;
      --semantic-status-positive:#00BF40; --semantic-status-cautionary:#FF9200; --semantic-status-negative:#FF4242;
      --semantic-accent-bg-redOrange:#FF5E00; --semantic-accent-bg-lime:#58CF04; --semantic-accent-bg-cyan:#00BDDE;
      --semantic-accent-bg-lightBlue:#00AEFF; --semantic-accent-bg-violet:#6541F2;
      --semantic-accent-bg-purple:#CB59FF; --semantic-accent-bg-pink:#F553DA;
      --semantic-accent-fg-red:#E52222; --semantic-accent-fg-redOrange:#F55A00; --semantic-accent-fg-orange:#D17600;
      --semantic-accent-fg-lime:#429E00; --semantic-accent-fg-green:#009632; --semantic-accent-fg-cyan:#0098B2;
      --semantic-accent-fg-lightBlue:#008DCF; --semantic-accent-fg-blue:#005EEB; --semantic-accent-fg-violet:#5B37ED;
      --semantic-accent-fg-purple:#AD36E3; --semantic-accent-fg-pink:#E846CD;
      --semantic-inverse-primary:#3385FF; --semantic-inverse-background:#1B1C1E; --semantic-inverse-label:#F7F7F8;
      --semantic-fill-normal:rgba(112,115,124,0.08); --semantic-fill-strong:rgba(112,115,124,0.16);
      --semantic-fill-alternative:rgba(112,115,124,0.05);
      --semantic-material-dimmer:rgba(23,23,25,0.52);

      /* Shadows */
      --shadow-xsmall:0px 1px 2px -1px rgba(23,23,23,0.10);
      --shadow-small:0px 2px 4px -2px rgba(23,23,23,0.06), 0px 4px 6px -1px rgba(23,23,23,0.06);
      --shadow-medium:0px 4px 6px -2px rgba(23,23,23,0.07), 0px 10px 15px -3px rgba(23,23,23,0.07);
      --shadow-large:0px 6px 10px -4px rgba(23,23,23,0.08), 0px 16px 24px -6px rgba(23,23,23,0.08);
      --shadow-xlarge:0px 10px 15px -5px rgba(23,23,23,0.10), 0px 24px 38px -10px rgba(23,23,23,0.12);
      --shadow-spread-small:0px 0px 60px 0px rgba(23,23,23,0.10);
      --shadow-spread-medium:0px 15px 75px 0px rgba(23,23,23,0.16);

      /* Spacing */
      --space-0:0px; --space-0-5:0.5px; --space-1:1px; --space-2:2px; --space-4:4px;
      --space-6:6px; --space-8:8px; --space-10:10px; --space-12:12px; --space-14:14px;
      --space-16:16px; --space-20:20px; --space-24:24px; --space-32:32px; --space-40:40px;
      --space-48:48px; --space-56:56px; --space-64:64px; --space-72:72px; --space-80:80px;

      /* Radii */
      --radius-sm:8px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --radius-2xl:20px; --radius-pill:9999px;

      /* Type — Pretendard ramp + tracking */
      --font-family-base:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --font-family-mono:"JetBrains Mono", "D2Coding", Menlo, Consolas, monospace;
      --type-title1-size:2rem;       --type-title1-line:2.75rem;   --type-title1-tracking:-0.0253em;
      --type-title3-size:1.5rem;     --type-title3-line:2rem;      --type-title3-tracking:-0.023em;
      --type-heading1-size:1.375rem; --type-heading1-line:1.875rem;--type-heading1-tracking:-0.0194em;
      --type-heading2-size:1.25rem;  --type-heading2-line:1.75rem; --type-heading2-tracking:-0.012em;
      --type-headline1-size:1.125rem;--type-headline1-line:1.625rem;--type-headline1-tracking:-0.002em;
      --type-headline2-size:1.0625rem;--type-headline2-line:1.5rem;--type-headline2-tracking:0em;
      --type-body1-size:1rem;        --type-body1-line:1.5rem;     --type-body1-tracking:0.0057em;
      --type-body2-size:0.9375rem;   --type-body2-line:1.375rem;   --type-body2-tracking:0.0096em;
      --type-label1-size:0.875rem;   --type-label1-line:1.25rem;   --type-label1-tracking:0.0145em;
      --type-label2-size:0.8125rem;  --type-label2-line:1.125rem;  --type-label2-tracking:0.0194em;
      --type-caption1-size:0.75rem;  --type-caption1-line:1rem;    --type-caption1-tracking:0.0252em;
      --type-caption2-size:0.6875rem;--type-caption2-line:0.875rem;--type-caption2-tracking:0.0311em;

      /* Weights */
      --weight-regular:400; --weight-medium:500; --weight-bold-display:700; --weight-bold-text:600;

      /* ── 경건생활 4항목 액센트 매핑 (도메인 → atomic) — 이 4쌍만 바꾸면 전부 따라옴 ── */
      --dev-read:        var(--atomic-green-50);   /* 말씀읽음 */
      --dev-verse:       var(--atomic-blue-50);    /* 와닿은말씀 */
      --dev-resolve:     var(--atomic-violet-50);  /* 결단 */
      --dev-prayer:      var(--atomic-orange-50);  /* 수련회기도 */
      --dev-read-fg:     var(--semantic-accent-fg-green);
      --dev-verse-fg:    var(--semantic-accent-fg-blue);
      --dev-resolve-fg:  var(--semantic-accent-fg-violet);
      --dev-prayer-fg:   var(--semantic-accent-fg-orange);

      /* ── Legacy 변수 alias (JSX inline style 호환용 — 절대 제거 금지) ── */
      --primary:        var(--semantic-primary-normal);
      --primary-strong: var(--semantic-primary-strong);
      --bg:             var(--semantic-background-normal-normal);
      --bg-alt:         var(--semantic-background-normal-alternative);
      --label-normal:   var(--semantic-label-normal);
      --label-alt:      var(--semantic-label-alternative);
      --line-solid:     var(--semantic-line-solid-normal);
      --fill-normal:    var(--semantic-fill-normal);
      --status-positive:   var(--semantic-status-positive);
      --status-cautionary: var(--semantic-status-cautionary);
      --status-negative:   var(--semantic-status-negative);
      --status-violet:     var(--atomic-violet-50);
      --font-base:         var(--font-family-base);

      /* 앱 셸 */
      --app-max: 460px;
      --appbar-h: 56px;
    }

    /* ── Dark theme — <html data-theme="dark"> ── */
    [data-theme="dark"]{
      --semantic-primary-normal:#3385FF; --semantic-primary-strong:#1A75FF; --semantic-primary-heavy:#0066FF;
      --semantic-label-normal:#F7F7F8; --semantic-label-strong:#ffffff;
      --semantic-label-neutral:rgba(194,196,200,0.88); --semantic-label-alternative:rgba(174,176,182,0.61);
      --semantic-label-assistive:rgba(174,176,182,0.28); --semantic-label-disable:rgba(152,155,162,0.16);
      --semantic-background-normal-normal:#1B1C1E; --semantic-background-normal-alternative:#0F0F10;
      --semantic-background-elevated-normal:#212225; --semantic-background-elevated-alternative:#141415;
      --semantic-interaction-inactive:#5A5C63; --semantic-interaction-disable:#2E2F33;
      --semantic-line-normal-normal:rgba(112,115,124,0.32);
      --semantic-line-normal-neutral:rgba(112,115,124,0.28);
      --semantic-line-normal-alternative:rgba(112,115,124,0.22);
      --semantic-line-solid-normal:#37383C; --semantic-line-solid-neutral:#333438; --semantic-line-solid-alternative:#2E2F33;
      --semantic-status-positive:#1ED45A; --semantic-status-cautionary:#FFA938; --semantic-status-negative:#FF6363;
      --semantic-fill-normal:rgba(112,115,124,0.22); --semantic-fill-strong:rgba(112,115,124,0.28);
      --semantic-fill-alternative:rgba(112,115,124,0.12);
      --semantic-material-dimmer:rgba(23,23,25,0.74);
      --semantic-inverse-primary:#0066FF; --semantic-inverse-background:#ffffff; --semantic-inverse-label:#171719;
    }

    /* ====== RESET / BASE ====== */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family:var(--font-family-base);
      color:var(--semantic-label-normal);
      background:var(--semantic-background-normal-alternative);
      font-size:var(--type-body1-size);
      line-height:var(--type-body1-line);
      letter-spacing:var(--type-body1-tracking);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
    textarea{font-family:inherit}
    #root{min-height:100dvh;display:flex;justify-content:center;background:var(--semantic-background-normal-alternative)}

    /* ====== APP SHELL ====== */
    .app{
      width:100%;max-width:var(--app-max);min-height:100dvh;
      background:var(--semantic-background-normal-normal);
      display:flex;flex-direction:column;position:relative;
      box-shadow:var(--shadow-spread-small);
    }
    @media(max-width:460px){.app{box-shadow:none;max-width:100%}}

    /* ====== APPBAR ====== */
    .appbar{
      position:sticky;top:0;z-index:10;
      background:color-mix(in srgb, var(--semantic-background-normal-normal) 88%, transparent);
      backdrop-filter:saturate(180%) blur(32px);
      -webkit-backdrop-filter:saturate(180%) blur(32px);
      border-bottom:1px solid var(--semantic-line-solid-normal);
      padding:env(safe-area-inset-top) 0 0;
    }
    .appbar-inner{height:var(--appbar-h);display:flex;align-items:center;padding:0 var(--space-16);gap:var(--space-8)}
    .appbar-title{flex:1;display:flex;flex-direction:column;line-height:1.15;min-width:0}
    .appbar-title .sub{
      font-size:var(--type-caption2-size);line-height:var(--type-caption2-line);
      letter-spacing:var(--type-caption2-tracking);
      color:var(--semantic-label-alternative);font-weight:var(--weight-medium);
    }
    .appbar-title .main{
      font-size:var(--type-headline2-size);line-height:1.25;
      letter-spacing:var(--type-headline2-tracking);
      font-weight:var(--weight-bold-text);
      color:var(--semantic-label-normal);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    /* ====== BUTTONS ====== */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      height:44px;padding:0 var(--space-16);
      border-radius:var(--radius-lg);
      font-size:var(--type-body2-size);letter-spacing:var(--type-body2-tracking);
      font-weight:var(--weight-bold-text);
      transition:background 150ms ease, box-shadow 150ms ease, color 150ms ease;
    }
    .btn.primary{background:var(--semantic-primary-normal);color:var(--semantic-static-white)}
    .btn.primary:hover{background:var(--semantic-primary-strong)}
    .btn.primary:active{background:var(--semantic-primary-heavy)}
    .btn.primary:disabled{opacity:.5}
    .btn.ghost{background:var(--semantic-fill-normal);color:var(--semantic-label-normal)}
    .btn.ghost:hover{background:var(--semantic-fill-strong)}
    .btn.block{width:100%}
    .btn.sm{height:32px;padding:0 var(--space-12);font-size:var(--type-label2-size);letter-spacing:var(--type-label2-tracking);border-radius:var(--radius-sm)}

    /* ====== LOGIN / 표지 ====== */
    .login{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      padding:var(--space-32) var(--space-24) var(--space-32);gap:var(--space-14);text-align:center;
    }
    .login h1{font-size:var(--type-heading1-size);line-height:var(--type-heading1-line);letter-spacing:var(--type-heading1-tracking);font-weight:var(--weight-bold-display);margin:0}
    .login p{color:var(--semantic-label-alternative);margin:0}
    /* ── 표지 cover (다크 히어로 + 크림 바디 + clay 버튼) ──
       LoginScreen 전용. 다크모드와 무관하게 고정. 에러/권한 화면은 generic .login 유지. */
    .cover{flex:1;display:flex;flex-direction:column;min-height:100dvh;background:#FAF9F5;color:#181715}

    /* 다크 히어로 */
    .cover-hero{
      background:#181715;color:#FAF9F5;
      padding:calc(env(safe-area-inset-top) + 44px) 28px 40px;
    }
    /* 안내 배너 — 다크 히어로 위에서도 항상 가독성 확보(고정색) */
    .cover-hero .login-notice{margin:0 0 16px;background:#FFF3E0;color:#B45309}
    .cover-hero .inapp-banner{margin:0 0 16px;background:#FFF3E0;border-color:#F3D6A8}
    .cover-hero .inapp-title{color:#B45309}
    .cover-hero .inapp-desc{color:#3D3D3D}
    .cover-brand-text{font-size:14px;font-weight:500;color:#FAF9F5;letter-spacing:-0.01em;margin-bottom:22px}
    .cover-title{
      margin:0;color:#FAF9F5;word-break:keep-all;
      font-family:'Noto Serif KR', serif;
      font-size:clamp(28px, 8.4vw, 32px);line-height:1.18;font-weight:600;letter-spacing:-0.01em;
    }
    .cover-sub{margin:14px 0 0;color:#A09D96;word-break:keep-all;font-size:16px;line-height:1.5}

    /* 크림 바디 */
    .cover-body{flex:1;display:flex;flex-direction:column;padding:28px 24px calc(env(safe-area-inset-bottom) + 24px)}
    .cover-features{display:flex;flex-direction:column;gap:18px}
    .feat-row{display:flex;align-items:center;gap:14px}
    .feat-icon{
      flex-shrink:0;width:44px;height:44px;border-radius:12px;
      display:inline-flex;align-items:center;justify-content:center;
      background:#EFE9DE;color:#CC785C;
    }
    .feat-title{font-size:15px;font-weight:600;color:#181715;line-height:1.25}
    .feat-sub{font-size:13px;color:#A09D96;margin-top:2px}

    /* CTA — 클레이 버튼 + 그 위에 투명 GIS 버튼 오버레이(실제 로그인) */
    .cover-cta-wrap{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:14px}
    .cover-cta{position:relative;width:100%;height:54px}
    .cta-clay{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
      background:#CC785C;color:#fff;border-radius:14px;font-size:16px;font-weight:600;
      pointer-events:none;box-shadow:0 6px 16px -6px rgba(204,120,92,0.5);
    }
    .cta-g{width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .cta-gis{position:absolute;inset:0;z-index:2;opacity:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .cta-mock{position:relative;width:100%;height:54px;background:#181715;color:#fff;border-radius:14px;font-size:15px;font-weight:600}
    .cover-foot{margin:0;font-size:13px;color:#A09D96;text-align:center;word-break:keep-all}

    /* ====== TOAST ====== */
    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:var(--semantic-inverse-background);color:var(--semantic-inverse-label);
      padding:var(--space-10) var(--space-16);border-radius:var(--radius-pill);
      font-size:var(--type-body2-size);box-shadow:var(--shadow-large);
      z-index:100;white-space:nowrap;
    }

    /* ====== TOP NAV ====== */
    .topnav{
      position:sticky;top:calc(env(safe-area-inset-top) + var(--appbar-h));z-index:9;
      display:flex;
      border-bottom:1px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);
      overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .topnav::-webkit-scrollbar{display:none}
    .topnav button{
      flex:1 1 0;min-width:0;padding:var(--space-12) var(--space-4);
      font-size:var(--type-caption1-size);letter-spacing:var(--type-caption2-tracking);
      color:var(--semantic-label-alternative);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;
      border-bottom:2px solid transparent;
      transition:color 150ms ease, border-color 150ms ease;
    }
    .topnav button.active{color:var(--semantic-primary-normal);font-weight:var(--weight-bold-text);border-bottom-color:var(--semantic-primary-normal)}

    /* ====== LOADING ====== */
    .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--semantic-label-alternative);padding:var(--space-40) 0}

    /* ====== SCROLL BODY ====== */
    .view{flex:1;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}

    /* ====== SECTION HEAD ====== */
    .section-head{
      padding:var(--space-16) var(--space-16) var(--space-6);
      font-size:var(--type-caption1-size);letter-spacing:0.04em;text-transform:uppercase;
      font-weight:var(--weight-bold-text);color:var(--semantic-label-alternative);
    }

    /* ====== ICON BTN (다크모드 토글) ====== */
    .icon-btn{
      width:36px;height:36px;border-radius:var(--radius-md);
      display:inline-flex;align-items:center;justify-content:center;
      color:var(--semantic-label-alternative);flex-shrink:0;
      transition:background 150ms ease, color 150ms ease;
    }
    .icon-btn:hover{background:var(--semantic-fill-normal);color:var(--semantic-label-normal)}

    /* ====== SHEET / MODAL ====== */
    .sheet-overlay{position:fixed;inset:0;background:var(--semantic-material-dimmer);display:flex;align-items:flex-end;z-index:50}
    .sheet{
      background:var(--semantic-background-elevated-normal);width:100%;max-width:var(--app-max);margin:0 auto;
      border-top-left-radius:var(--radius-2xl);border-top-right-radius:var(--radius-2xl);
      max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
      box-shadow:var(--shadow-xlarge);
    }
    .sheet-handle{width:36px;height:4px;border-radius:var(--radius-pill);background:var(--semantic-line-solid-normal);margin:var(--space-10) auto var(--space-6)}
    .sheet-header{padding:var(--space-4) var(--space-20) var(--space-10);display:flex;align-items:center;justify-content:space-between;gap:var(--space-12)}
    .sheet-header h3{font-size:var(--type-headline1-size);line-height:var(--type-headline1-line);letter-spacing:var(--type-headline1-tracking);font-weight:var(--weight-bold-text);margin:0}
    .sheet-close{width:36px;height:36px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--semantic-label-alternative)}
    .sheet-close:hover{background:var(--semantic-fill-normal)}
    .sheet-body{padding:0 var(--space-20) var(--space-20);overflow-y:auto;flex:1}

    /* ====== FORM ====== */
    .form-row{margin:0 var(--space-16) var(--space-14)}
    .form-label{font-size:var(--type-label2-size);letter-spacing:var(--type-label2-tracking);font-weight:var(--weight-bold-text);color:var(--semantic-label-alternative);margin-bottom:var(--space-6);display:flex;align-items:center;gap:var(--space-6)}
    .form-input,.form-textarea{
      width:100%;padding:var(--space-12);
      border:1.5px solid var(--semantic-line-solid-normal);border-radius:var(--radius-md);
      font:inherit;font-size:var(--type-body2-size);color:var(--semantic-label-normal);
      background:var(--semantic-background-normal-normal);
      transition:border-color 150ms ease;outline:none;resize:vertical;
    }
    .form-textarea{min-height:76px;line-height:1.5}
    .form-input:focus,.form-textarea:focus{border-color:var(--semantic-primary-normal);box-shadow:0 0 0 3px color-mix(in srgb, var(--semantic-primary-normal) 12%, transparent)}
    .form-textarea.verse:focus{border-color:var(--dev-verse);box-shadow:0 0 0 3px color-mix(in srgb, var(--dev-verse) 12%, transparent)}
    .form-textarea.resolve:focus{border-color:var(--dev-resolve);box-shadow:0 0 0 3px color-mix(in srgb, var(--dev-resolve) 12%, transparent)}

    /* ====== DATE TOGGLE (오늘/어제) ====== */
    .date-toggle{display:flex;gap:6px;padding:12px 16px 4px}
    .date-toggle button{
      flex:1;min-height:44px;border:1px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);border-radius:var(--radius-pill);
      font-size:var(--type-body2-size);font-weight:var(--weight-bold-text);
      color:var(--semantic-label-alternative);
      transition:background 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .date-toggle button.active{background:var(--semantic-primary-normal);border-color:transparent;color:#fff}
    .date-caption{padding:2px 16px 8px;font-size:var(--type-label2-size);color:var(--semantic-label-alternative)}

    /* ====== READING CARDS (맥체인 본문) ====== */
    .reading-group{padding:4px 16px}
    .reading-group-head{font-size:var(--type-caption1-size);font-weight:var(--weight-bold-text);color:var(--semantic-label-alternative);letter-spacing:0.03em;margin:8px 0 6px}
    .reading-card{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;margin-bottom:8px;
      border:1px solid var(--semantic-line-solid-normal);border-radius:var(--radius-lg);
      background:color-mix(in srgb, var(--dev-read) 4%, var(--semantic-background-normal-normal));
    }
    .reading-card .rc-dot{width:10px;height:10px;border-radius:50%;background:var(--dev-read);flex-shrink:0}
    .reading-card .rc-text{font-weight:var(--weight-bold-text);color:var(--semantic-label-normal)}
    .reading-card.secret{background:color-mix(in srgb, var(--dev-verse) 4%, var(--semantic-background-normal-normal))}
    .reading-card.secret .rc-dot{background:var(--dev-verse)}
    .reading-missing{margin:8px 16px;padding:12px 14px;border-radius:var(--radius-lg);background:var(--semantic-fill-normal);color:var(--semantic-label-alternative);font-size:var(--type-label2-size);line-height:1.5}

    /* ====== CHECK PILL (말씀읽음 / 수련회기도 토글) ====== */
    .check-pill{
      display:inline-flex;align-items:center;gap:var(--space-6);
      min-height:44px;
      padding:var(--space-8) var(--space-16);border-radius:var(--radius-pill);
      font-size:var(--type-body2-size);font-weight:var(--weight-bold-text);
      border:1.5px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);
      color:var(--semantic-label-neutral);cursor:pointer;
      transition:background 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }
    .check-pill .check-icon{font-size:15px}
    .check-pill.read.checked{background:color-mix(in srgb, var(--dev-read) 14%, transparent);border-color:var(--dev-read);color:var(--dev-read-fg);box-shadow:0 0 0 1px color-mix(in srgb, var(--dev-read) 18%, transparent)}
    .check-pill.prayer.checked{background:color-mix(in srgb, var(--dev-prayer) 14%, transparent);border-color:var(--dev-prayer);color:var(--dev-prayer-fg);box-shadow:0 0 0 1px color-mix(in srgb, var(--dev-prayer) 18%, transparent)}
    @keyframes chip-pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
    .check-pill.checked{animation:chip-pop .25s ease}
    @media (prefers-reduced-motion: reduce){.check-pill.checked{animation:none}}

    /* ====== STREAK / STAT CARDS ====== */
    .streak-card{
      margin:12px 16px;padding:18px 16px;border-radius:var(--radius-xl);
      background:color-mix(in srgb, var(--dev-read) 8%, var(--semantic-background-normal-normal));
      border:1px solid color-mix(in srgb, var(--dev-read) 22%, transparent);
      display:flex;align-items:center;gap:16px;
    }
    .streak-flame{font-size:38px;line-height:1;flex-shrink:0}
    .streak-num{font-size:34px;line-height:1;font-weight:var(--weight-bold-display);color:var(--dev-read-fg)}
    .streak-label{font-size:var(--type-label2-size);color:var(--semantic-label-alternative);margin-top:2px}

    .rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 16px}
    .rate-card{
      padding:14px;border-radius:var(--radius-lg);
      border:1px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);
    }
    .rate-title{font-size:var(--type-caption1-size);text-transform:uppercase;letter-spacing:0.03em;color:var(--semantic-label-alternative);font-weight:var(--weight-bold-text)}
    .rate-pct{font-size:26px;font-weight:var(--weight-bold-display);color:var(--semantic-primary-normal);line-height:1.2;margin:4px 0 2px}
    .rate-meta{font-size:var(--type-caption1-size);color:var(--semantic-label-alternative)}
    .rate-track{height:6px;border-radius:3px;background:var(--semantic-fill-normal);overflow:hidden;margin-top:8px}
    .rate-fill{height:100%;background:var(--semantic-primary-normal);border-radius:3px;transition:width 240ms ease}

    .prayer-counter{
      margin:8px 16px;padding:14px 16px;border-radius:var(--radius-lg);
      border:1px solid color-mix(in srgb, var(--dev-prayer) 22%, transparent);
      background:color-mix(in srgb, var(--dev-prayer) 6%, var(--semantic-background-normal-normal));
      display:flex;align-items:center;gap:12px;
    }
    .prayer-counter .pc-num{font-size:24px;font-weight:var(--weight-bold-display);color:var(--dev-prayer-fg)}
    .prayer-counter .pc-label{font-size:var(--type-label2-size);color:var(--semantic-label-normal)}

    /* ====== ENCOURAGE BANNER ====== */
    .encourage{
      margin:12px 16px;padding:14px 16px;border-radius:var(--radius-xl);
      background:color-mix(in srgb, var(--enc-color) 12%, var(--semantic-background-normal-normal));
      border:1px solid color-mix(in srgb, var(--enc-color) 30%, transparent);
      display:flex;gap:12px;align-items:flex-start;
    }
    .encourage .enc-icon{font-size:20px;line-height:1.3;flex-shrink:0}
    .encourage .enc-text{font-size:var(--type-body2-size);font-weight:var(--weight-medium);color:var(--semantic-label-normal);line-height:1.5}

    /* ====== RECORD CARD (최근 기록 리스트) ====== */
    .record-card{
      margin:8px 16px;padding:12px 14px;border-radius:var(--radius-lg);
      border:1px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);
      display:flex;align-items:center;gap:12px;text-align:left;width:calc(100% - 32px);
      transition:border-color 150ms ease, background 150ms ease;
    }
    .record-card:hover{background:var(--semantic-fill-alternative)}
    .record-date{font-weight:var(--weight-bold-text);color:var(--semantic-label-normal);min-width:96px}
    .record-rel{font-size:var(--type-caption1-size);color:var(--semantic-label-alternative);margin-top:1px}
    .record-badges{margin-left:auto;display:flex;gap:5px}
    .rbadge{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--semantic-fill-normal);color:var(--semantic-label-assistive)}
    .rbadge.on.read{background:color-mix(in srgb, var(--dev-read) 16%, transparent);color:var(--dev-read-fg)}
    .rbadge.on.verse{background:color-mix(in srgb, var(--dev-verse) 16%, transparent);color:var(--dev-verse-fg)}
    .rbadge.on.resolve{background:color-mix(in srgb, var(--dev-resolve) 16%, transparent);color:var(--dev-resolve-fg)}
    .rbadge.on.prayer{background:color-mix(in srgb, var(--dev-prayer) 16%, transparent);color:var(--dev-prayer-fg)}
    .empty-note{margin:24px 16px;text-align:center;color:var(--semantic-label-alternative);font-size:var(--type-body2-size)}

    /* ====== SHEET DETAIL (기록 상세) ====== */
    .detail-field{margin-bottom:16px}
    .detail-field .df-label{display:flex;align-items:center;gap:6px;font-size:var(--type-label2-size);font-weight:var(--weight-bold-text);color:var(--semantic-label-alternative);margin-bottom:4px}
    .detail-field .df-dot{width:9px;height:9px;border-radius:50%}
    .detail-field .df-value{font-size:var(--type-body2-size);color:var(--semantic-label-normal);white-space:pre-wrap;line-height:1.55}
    .detail-field .df-value.muted{color:var(--semantic-label-assistive)}

    /* ====== TEAM GRID (우리팀) ====== */
    .team-card{
      margin:8px 16px;padding:12px 14px;border-radius:var(--radius-lg);
      border:1px solid var(--semantic-line-solid-normal);
      background:var(--semantic-background-normal-normal);text-align:left;width:calc(100% - 32px);
    }
    .team-card:hover{background:var(--semantic-fill-alternative)}
    .team-top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
    .team-name{font-weight:var(--weight-bold-text);color:var(--semantic-label-normal);font-size:var(--type-body2-size)}
    .team-stat{margin-left:auto;font-size:var(--type-caption1-size);color:var(--semantic-label-alternative)}
    .team-stat b{color:var(--dev-read-fg);font-weight:var(--weight-bold-display)}
    .team-week{display:flex;gap:5px}
    .day-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
    .day-dow{font-size:10px;color:var(--semantic-label-assistive)}
    .day-mark{width:100%;max-width:30px;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--semantic-fill-normal);color:var(--semantic-label-assistive)}
    .day-mark.on{background:color-mix(in srgb, var(--dev-read) 16%, transparent);color:var(--dev-read-fg)}
    .day-mark.today{outline:2px solid color-mix(in srgb, var(--semantic-primary-normal) 40%, transparent);outline-offset:1px}

    /* ====== NOTICES ====== */
    .login-notice{
      padding:var(--space-8) var(--space-14);border-radius:var(--radius-md);
      background:color-mix(in srgb, var(--semantic-status-cautionary) 10%, transparent);
      color:var(--semantic-accent-fg-orange);
      font-size:var(--type-label2-size);font-weight:var(--weight-bold-text);
    }
    .inapp-banner{
      margin:0;padding:var(--space-12) var(--space-14);border-radius:var(--radius-lg);
      background:color-mix(in srgb, var(--semantic-status-cautionary) 14%, var(--semantic-background-normal-normal));
      border:1px solid color-mix(in srgb, var(--semantic-status-cautionary) 40%, transparent);
    }
    .inapp-title{font-size:var(--type-label1-size);font-weight:var(--weight-bold-text);color:var(--semantic-accent-fg-orange);margin-bottom:var(--space-4)}
    .inapp-desc{font-size:var(--type-caption1-size);color:var(--semantic-label-normal);line-height:1.5;margin-bottom:var(--space-10)}
    .inapp-actions{display:flex;gap:var(--space-8);flex-wrap:wrap}

    /* ── 라이트 전용 오버라이드: 밝고 따뜻한 크림/코랄 테마 (다크와 무관) ──
       다크 모드는 <html data-theme="dark">이므로 :root:not([data-theme="dark"])로
       라이트에서만 적용. 기존 토큰 정의는 건드리지 않고 캐스케이드로 덮는다. */
    :root:not([data-theme="dark"]){
      --bg:#FFF9F2;                          /* 따뜻한 크림 화이트 */
      --semantic-primary-normal:#FF6B4A;     /* 코랄 포인트 */
      --semantic-primary-strong:#F25533;     /* hover */
      --semantic-primary-heavy:#DD4424;      /* active */
      --radius-lg:16px; --radius-xl:20px; --radius-2xl:24px;
    }
    :root:not([data-theme="dark"]) .app{background:#FFF9F2}
    :root:not([data-theme="dark"]) #root{background:#FFF3EA}
    :root:not([data-theme="dark"]) .appbar{
      background:linear-gradient(135deg,#FFB45A 0%,#FF6B4A 100%);
      border-bottom-color:transparent;
    }
    :root:not([data-theme="dark"]) .appbar .appbar-title .sub{color:rgba(255,255,255,.85)}
    :root:not([data-theme="dark"]) .appbar .appbar-title .main{color:#fff}
    :root:not([data-theme="dark"]) .appbar .icon-btn,
    :root:not([data-theme="dark"]) .appbar .btn.ghost{color:#fff;border:1px solid rgba(255,255,255,.4)}
    :root:not([data-theme="dark"]) .reading-card,
    :root:not([data-theme="dark"]) .rate-card,
    :root:not([data-theme="dark"]) .record-card,
    :root:not([data-theme="dark"]) .team-card{box-shadow:0 2px 10px rgba(255,107,74,.06)}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // ── 앱 설정 (배포 시 실제 값으로 교체) ──
    // MOCK: false 이거나, 이메일 문자열이면 GIS 로그인을 건너뛰고 idToken='mock:'+MOCK 로 동작(개발/E2E 전용).
    window.APP_CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycbzGj30TX8J-9LuWkPbFFA40lIYpyHoEAtX9CP9gVBjQnekTbAjver0L4Vq9K_3XscKrPw/exec',
      OAUTH_CLIENT_ID: '90527666620-ududtg9blamqqp06v7i21uo4loijqs12.apps.googleusercontent.com',
      MOCK: false,
    };
  </script>
  <script src="./mccheyne-plan.js"></script>
  <script src="./dev-stats-utils.js"></script>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const DevStats = window.DevStatsUtils;

    // ──────────────── API client ────────────────
    // 클라이언트 읽기 캐시 — 탭 전환 시 재요청을 막아 즉시 화면 전환.
    // 쓰기 액션이 성공하면 관련 읽기 캐시를 무효화한다. (계약 §5)
    const apiCache = new Map(); // key → { t, json }
    const READ_TTL_MS = 2 * 60 * 1000; // 2분 (서버 캐시 5분보다 짧게)
    const READ_ACTIONS = ['getMyRecords', 'getAllRecords', 'getMembers'];
    const WRITE_INVALIDATES = {
      setRecord: ['getMyRecords', 'getAllRecords'],
    };
    function invalidateApiCache(prefixes) {
      Array.from(apiCache.keys()).forEach((k) => {
        if (prefixes.some((p) => k.indexOf(p + '|') === 0)) apiCache.delete(k);
      });
    }
    // 세대 카운터: 로그아웃/만료로 clear된 뒤, 그 이전에 발사된 in-flight 응답이
    // 캐시에 도로 적재되는 것을 막는다 (공유 기기에서 이전 사용자 데이터 노출 방지).
    let apiCacheGen = 0;
    function clearApiCache() { apiCache.clear(); apiCacheGen++; }

    const apiInflight = new Map(); // key → Promise

    async function callApiRaw_(action, payload, cacheKey) {
      const genAtStart = apiCacheGen;
      const body = JSON.stringify({ action, ...payload });
      const res = await fetch(window.APP_CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body,
      });
      if (!res.ok) throw new Error('네트워크 오류 ' + res.status);
      const json = await res.json();
      if (json && json.ok === false && (json.code === 'token_expired' || json.code === 'invalid_token')) {
        // 토큰 만료(구글 ID Token ~1시간): 저장소·캐시를 비우고 로그인 화면으로 전환하도록 알림
        sessionStorage.removeItem('idToken');
        clearApiCache();
        window.dispatchEvent(new CustomEvent('app:session-expired'));
      }
      if (json && json.ok) {
        if (cacheKey && genAtStart === apiCacheGen) apiCache.set(cacheKey, { t: Date.now(), json });
        if (WRITE_INVALIDATES[action]) invalidateApiCache(WRITE_INVALIDATES[action]);
      }
      return json;
    }

    function callApi(action, payload) {
      // 캐시 키에 idToken은 제외 (세션당 단일 사용자, 로그아웃 시 전체 clear)
      const cacheKey = READ_ACTIONS.indexOf(action) >= 0
        ? action + '|' + JSON.stringify({ ...payload, idToken: undefined })
        : null;
      if (cacheKey) {
        const hit = apiCache.get(cacheKey);
        if (hit && Date.now() - hit.t < READ_TTL_MS) return Promise.resolve(hit.json);
        const inflight = apiInflight.get(cacheKey);
        if (inflight) return inflight;
      }
      const p = callApiRaw_(action, payload, cacheKey);
      if (cacheKey) {
        apiInflight.set(cacheKey, p);
        p.then(() => apiInflight.delete(cacheKey), () => apiInflight.delete(cacheKey));
      }
      return p;
    }

    // ──────────────── 표준 날짜 (Asia/Seoul) ────────────────
    // 계약 §1: 표준 오늘 = Asia/Seoul 'YYYY-MM-DD'. 브라우저 로컬 TZ 사용 금지.
    function todayKST() {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
    }
    function addDays(iso, n) {
      const d = new Date(iso + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    }
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];
    function fmtKDate(iso) {
      const d = new Date(iso + 'T00:00:00Z');
      if (isNaN(d.getTime())) return iso;
      return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + DOW[d.getUTCDay()] + ')';
    }
    function relativeDate(iso, today) {
      const diff = Math.round((Date.parse(today + 'T00:00:00Z') - Date.parse(iso + 'T00:00:00Z')) / 86400000);
      if (diff === 0) return '오늘';
      if (diff === 1) return '어제';
      if (diff > 1 && diff < 14) return diff + '일 전';
      if (diff >= 14) return Math.floor(diff / 7) + '주 전';
      return '';
    }

    // 맥체인 본문 조회 — mccheyne-plan.js가 없거나 null이면 null 반환(본문 카드 숨김).
    function getReadings(dateStr) {
      try {
        if (window.MccheynePlan && typeof window.MccheynePlan.getReadings === 'function') {
          return window.MccheynePlan.getReadings(dateStr) || null;
        }
      } catch (e) { /* noop */ }
      return null;
    }

    // 인앱 브라우저 감지 (카카오톡 등은 구글 로그인이 차단됨).
    function detectInApp() {
      const ua = (navigator.userAgent || '');
      if (/KAKAOTALK/i.test(ua)) return 'kakaotalk';
      if (/(FBAN|FBAV|FB_IAB|Instagram|Line\/|NAVER|DaumApps|everytimeApp|wv\)|; wv)/i.test(ua)) return 'inapp';
      return null;
    }

    function isTeacher(me) {
      return me && (me.role === 'teacher' || me.role === 'admin');
    }

    // ──────────────── Google Auth ────────────────
    function useGoogleAuth() {
      const mock = window.APP_CONFIG.MOCK;
      const isMock = typeof mock === 'string' && mock.length > 0;
      const [idToken, setIdToken] = useState(() => {
        if (isMock) return 'mock:' + mock;
        return sessionStorage.getItem('idToken') || null;
      });
      const [ready, setReady] = useState(isMock);
      const [expired, setExpired] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        const onExpired = () => { setExpired(true); setIdToken(null); };
        window.addEventListener('app:session-expired', onExpired);
        return () => window.removeEventListener('app:session-expired', onExpired);
      }, []);

      useEffect(() => {
        // MOCK 모드: GIS를 전혀 건드리지 않는다 (스크립트 로드 실패해도 동작해야 함).
        if (isMock) return;
        let cancelled = false;
        let attempts = 0;
        let timerId = null;
        const tryInit = () => {
          if (cancelled) return;
          if (!window.google || !window.google.accounts || !window.google.accounts.id) {
            attempts++;
            if (attempts > 50) { console.warn('GIS failed to load after 5s'); return; }
            timerId = setTimeout(tryInit, 100);
            return;
          }
          google.accounts.id.initialize({
            client_id: window.APP_CONFIG.OAUTH_CLIENT_ID,
            callback: (resp) => {
              if (resp && resp.credential) {
                sessionStorage.setItem('idToken', resp.credential);
                setExpired(false);
                setIdToken(resp.credential);
              }
            },
            auto_select: false,
          });
          setReady(true);
        };
        tryInit();
        return () => { cancelled = true; if (timerId) clearTimeout(timerId); };
      }, [isMock]);

      const renderButton = useCallback(() => {
        if (isMock || !ready || !containerRef.current) return;
        const avail = containerRef.current.offsetWidth || 320;
        const width = Math.max(200, Math.min(400, Math.round(avail)));
        google.accounts.id.renderButton(containerRef.current, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'center', width });
      }, [ready, isMock]);

      useEffect(() => { if (ready && !idToken) renderButton(); }, [ready, idToken, renderButton]);

      const signOut = useCallback(() => {
        sessionStorage.removeItem('idToken');
        clearApiCache();
        setExpired(false);
        setIdToken(null);
        if (!isMock && window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      }, [isMock]);

      return { idToken, ready, expired, isMock, containerRef, signOut };
    }

    // ──────────────── Toast ────────────────
    function Toast({ msg }) {
      if (!msg) return null;
      return <div className="toast">{msg}</div>;
    }
    function useToast() {
      const [msg, setMsg] = useState(null);
      const timerRef = useRef(null);
      const show = useCallback((m) => {
        setMsg(m);
        if (timerRef.current) clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => setMsg(null), 2200);
      }, []);
      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);
      return React.useMemo(() => ({ msg, show }), [msg, show]);
    }

    // ──────────────── InApp notice ────────────────
    function InAppNotice({ kind }) {
      const [copied, setCopied] = useState(false);
      const url = (typeof location !== 'undefined') ? location.href : '';
      const openExternal = () => {
        try { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); } catch (e) {}
      };
      const copy = () => {
        const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, done);
        } else { done(); }
      };
      return (
        <div className="inapp-banner" role="alert">
          <div className="inapp-title">⚠ 인앱 브라우저에서는 구글 로그인이 차단됩니다</div>
          <div className="inapp-desc">
            {kind === 'kakaotalk'
              ? '아래 버튼을 누르거나, 우측 하단/상단 메뉴에서 "다른 브라우저로 열기"를 선택하세요.'
              : '우측 상단 메뉴(⋯ 또는 공유)에서 "다른 브라우저로 열기" / "Safari로 열기"를 선택하세요.'}
          </div>
          <div className="inapp-actions">
            {kind === 'kakaotalk' && (
              <button className="btn primary sm" onClick={openExternal}>외부 브라우저로 열기</button>
            )}
            <button className="btn ghost sm" onClick={copy}>{copied ? '복사됨 ✓' : '주소 복사'}</button>
          </div>
        </div>
      );
    }

    // ──────────────── Login cover ────────────────
    const COVER_FEATURES = [
      { title: '말씀 읽기 체크', sub: '오늘 맥체인 본문을 읽었는지', paths: (
        <><circle cx="12" cy="12" r="9" /><path d="M8.3 12.2l2.6 2.6 4.8-5.2" /></>
      )},
      { title: '와닿은 말씀 · 결단', sub: '오늘을 어떻게 살지 기록', paths: (
        <><path d="M4 5h13a2 2 0 0 1 2 2v12l-3-2-3 2-3-2-3 2V5z" /><path d="M8 9h7M8 12.5h5" /></>
      )},
      { title: '나의 현황 대시보드', sub: '연속 기록·주간·월간 달성률', paths: (
        <><path d="M4 20V5" /><path d="M4 20h16" /><rect x="7" y="12" width="3.2" height="5" rx="1" /><rect x="13.5" y="8" width="3.2" height="9" rx="1" /></>
      )},
    ];

    function LoginScreen({ containerRef, notice, isMock }) {
      const inApp = detectInApp();
      return (
        <div className="cover">
          <div className="cover-hero">
            {notice && <div className="login-notice" role="alert">{notice}</div>}
            {inApp && <InAppNotice kind={inApp} />}
            <div className="cover-brand-text">혜림교회</div>
            <h1 className="cover-title">경건생활 점검</h1>
            <p className="cover-sub">혜림교회 청소년부 찬양팀</p>
          </div>

          <div className="cover-body">
            <div className="cover-features">
              {COVER_FEATURES.map((f) => (
                <div className="feat-row" key={f.title}>
                  <span className="feat-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      {f.paths}
                    </svg>
                  </span>
                  <div className="feat-text">
                    <div className="feat-title">{f.title}</div>
                    <div className="feat-sub">{f.sub}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="cover-cta-wrap">
              {isMock ? (
                <div className="cta-mock">MOCK 모드 — 로그인 없이 진입</div>
              ) : (
                <div className="cover-cta">
                  <div className="cta-clay" aria-hidden="true">
                    <span className="cta-g">
                      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                      </svg>
                    </span>
                    <span>Google 계정으로 로그인</span>
                  </div>
                  <div ref={containerRef} className="cta-gis" />
                </div>
              )}
              <p className="cover-foot">찬양팀 전용 · 등록된 계정만 접근할 수 있습니다</p>
            </div>
          </div>
        </div>
      );
    }

    function UnauthorizedScreen({ email, onSignOut }) {
      return (
        <div className="login">
          <h1>접근 권한이 없어요</h1>
          <p>{email ? email + ' 계정은' : '로그인한 계정은'} 찬양팀 명단에 등록되지 않았습니다.</p>
          <p>담당 교사에게 등록을 요청하세요.</p>
          <button className="btn ghost" onClick={onSignOut}>다른 계정으로 로그인</button>
        </div>
      );
    }

    // ──────────────── App (top-level) ────────────────
    function App() {
      const auth = useGoogleAuth();
      const [me, setMe] = useState(null);
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        if (!auth.idToken) { setMe(null); setAuthError(null); return; }
        let aborted = false;
        // whoami를 기다리지 않고 내 기록을 미리 당겨온다 (병렬 prefetch).
        callApi('getMyRecords', { idToken: auth.idToken }).catch(function(){});
        callApi('whoami', { idToken: auth.idToken })
          .then((r) => {
            if (aborted) return;
            if (r.ok) {
              setMe({ email: r.email, name: r.name, role: r.role || 'student', part: r.part || '' });
              setAuthError(null);
            } else if (r.code === 'unauthorized') {
              setAuthError({ code: 'unauthorized', email: r.email }); setMe(null);
            } else if (r.code === 'token_expired' || r.code === 'invalid_token' || r.code === 'aud_mismatch' || r.code === 'iss_mismatch' || r.code === 'email_unverified') {
              sessionStorage.removeItem('idToken');
              auth.signOut();
            } else {
              setAuthError({ code: r.code || 'unknown' }); setMe(null);
            }
          })
          .catch((e) => { if (!aborted) setAuthError({ code: 'network', message: e.message }); });
        return () => { aborted = true; };
      }, [auth.idToken, auth.signOut]);

      if (!auth.idToken) {
        return (
          <div className="app">
            <LoginScreen containerRef={auth.containerRef} isMock={auth.isMock}
              notice={auth.expired ? '로그인이 만료되었습니다. 다시 로그인해 주세요.' : null} />
          </div>
        );
      }
      if (authError && authError.code === 'unauthorized') {
        return <div className="app"><UnauthorizedScreen email={authError.email} onSignOut={auth.signOut} /></div>;
      }
      if (!me) {
        if (authError) {
          return (
            <div className="app">
              <div className="login">
                <h1>서버에 연결할 수 없어요</h1>
                <p>네트워크 또는 서버(GAS) 설정 문제일 수 있습니다.</p>
                <p style={{fontSize:12,color:'var(--label-alt)'}}>오류 코드: {authError.code}{authError.message ? ' · ' + authError.message : ''}</p>
                <button className="btn ghost" onClick={auth.signOut}>로그아웃</button>
              </div>
            </div>
          );
        }
        return <div className="app"><div className="loading">로그인 확인 중…</div></div>;
      }

      return <Shell me={me} idToken={auth.idToken} onSignOut={auth.signOut} />;
    }

    // ──────────────── Shell ────────────────
    function Shell({ me, idToken, onSignOut }) {
      const [tab, setTab] = useState('today');
      const toast = useToast();
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; }
      });
      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        if (next === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
      };

      // 우리팀 탭은 teacher/admin일 때만 노출 (계약 §6)
      const TABS = useMemo(() => {
        const base = [['today', '오늘'], ['stats', '나의 현황']];
        if (isTeacher(me)) base.push(['team', '우리팀']);
        return base;
      }, [me]);
      const validTab = TABS.some(([k]) => k === tab) ? tab : 'today';

      return (
        <div className="app">
          <div className="appbar">
            <div className="appbar-inner">
              <div className="appbar-title">
                <div className="sub">경건생활 점검 · 청소년부 찬양팀</div>
                <div className="main">{me.name || me.email}</div>
              </div>
              <button className="icon-btn" onClick={toggleTheme}
                aria-label={theme === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환'}
                title={theme === 'dark' ? '라이트 모드' : '다크 모드'}>
                {theme === 'dark' ? (
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="2"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                  </svg>
                ) : (
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                )}
              </button>
              <button className="btn ghost" onClick={onSignOut} style={{height:36,fontSize:13}}>로그아웃</button>
            </div>
          </div>

          <div className="topnav">
            {TABS.map(([k, label]) => (
              <button key={k} className={validTab === k ? 'active' : ''} onClick={() => setTab(k)}>{label}</button>
            ))}
          </div>

          {validTab === 'today' && <TodayView idToken={idToken} me={me} toast={toast} />}
          {validTab === 'stats' && <MyStatsView idToken={idToken} me={me} toast={toast} />}
          {validTab === 'team' && isTeacher(me) && <TeamView idToken={idToken} me={me} toast={toast} />}

          <Toast msg={toast.msg} />
        </div>
      );
    }

    // ──────────────── TodayView ────────────────
    function TodayView({ idToken, me, toast }) {
      const today = todayKST();
      const yesterday = addDays(today, -1);
      const [dateStr, setDateStr] = useState(today);
      const [rows, setRows] = useState(null);
      const [wordRead, setWordRead] = useState(false);
      const [verse, setVerse] = useState('');
      const [resolution, setResolution] = useState('');
      const [retreatPrayer, setRetreatPrayer] = useState(false);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        let aborted = false; setLoading(true);
        callApi('getMyRecords', { idToken }).then((r) => {
          if (aborted) return;
          if (r.ok) setRows(r.rows || []); else { toast.show('기록 불러오기 실패'); setRows([]); }
          setLoading(false);
        }).catch(() => { if (!aborted) { toast.show('네트워크 오류'); setRows([]); setLoading(false); } });
        return () => { aborted = true; };
      }, [idToken, toast.show]);

      // 선택 날짜의 기존 기록을 폼에 채운다.
      useEffect(() => {
        if (!rows) return;
        const row = rows.find((x) => x.date === dateStr);
        setWordRead(row ? !!row.wordRead : false);
        setVerse(row ? (row.verse || '') : '');
        setResolution(row ? (row.resolution || '') : '');
        setRetreatPrayer(row ? !!row.retreatPrayer : false);
      }, [rows, dateStr]);

      const readings = getReadings(dateStr);

      const save = () => {
        setSaving(true);
        callApi('setRecord', { idToken, date: dateStr, wordRead, verse, resolution, retreatPrayer })
          .then((r) => {
            setSaving(false);
            if (r.ok) {
              toast.show('저장되었습니다 ✓');
              setRows((prev) => {
                const others = (prev || []).filter((x) => x.date !== dateStr);
                return others.concat([{ date: dateStr, wordRead, verse, resolution, retreatPrayer, updatedAt: new Date().toISOString() }]);
              });
            } else if (r.code === 'bad_request') {
              toast.show('오늘 또는 어제만 기록할 수 있어요');
            } else {
              toast.show('저장 실패');
            }
          })
          .catch(() => { setSaving(false); toast.show('네트워크 오류'); });
      };

      if (loading) return <div className="loading">기록 불러오는 중…</div>;

      return (
        <div className="view">
          <div className="date-toggle">
            <button className={dateStr === today ? 'active' : ''} onClick={() => setDateStr(today)}>오늘</button>
            <button className={dateStr === yesterday ? 'active' : ''} onClick={() => setDateStr(yesterday)}>어제 기록하기</button>
          </div>
          <div className="date-caption">{fmtKDate(dateStr)} 기록</div>

          {readings ? (
            <>
              <div className="reading-group">
                <div className="reading-group-head">가정 예배 본문 · 맥체인 {readings.day}일차</div>
                {readings.family.map((t, i) => (
                  <div className="reading-card" key={'f' + i}>
                    <span className="rc-dot" /><span className="rc-text">{t}</span>
                  </div>
                ))}
              </div>
              <div className="reading-group">
                <div className="reading-group-head">개인 묵상 본문</div>
                {readings.secret.map((t, i) => (
                  <div className="reading-card secret" key={'s' + i}>
                    <span className="rc-dot" /><span className="rc-text">{t}</span>
                  </div>
                ))}
              </div>
            </>
          ) : (
            <div className="reading-missing">
              오늘의 맥체인 본문을 불러올 수 없습니다. 본문은 성경일기(맥체인)를 참고해 직접 읽고 아래에 체크해 주세요.
            </div>
          )}

          <div className="section-head">오늘의 점검</div>

          <div className="form-row">
            <button className={'check-pill read' + (wordRead ? ' checked' : '')} onClick={() => setWordRead((v) => !v)}>
              <span className="check-icon">{wordRead ? '✓' : '○'}</span> 말씀 읽음
            </button>
          </div>

          <div className="form-row">
            <label className="form-label"><span className="df-dot" style={{background:'var(--dev-verse)'}} /> 와닿은 말씀</label>
            <textarea className="form-textarea verse" value={verse} onChange={(e) => setVerse(e.target.value)}
              placeholder="오늘 마음에 와닿은 말씀 구절을 적어보세요" />
          </div>

          <div className="form-row">
            <label className="form-label"><span className="df-dot" style={{background:'var(--dev-resolve)'}} /> 결단</label>
            <textarea className="form-textarea resolve" value={resolution} onChange={(e) => setResolution(e.target.value)}
              placeholder="그 말씀으로 오늘을 어떻게 지낼지 적어보세요" />
          </div>

          <div className="form-row">
            <button className={'check-pill prayer' + (retreatPrayer ? ' checked' : '')} onClick={() => setRetreatPrayer((v) => !v)}>
              <span className="check-icon">{retreatPrayer ? '✓' : '○'}</span> 수련회를 위한 기도
            </button>
          </div>

          <div className="form-row">
            <button className="btn primary block" onClick={save} disabled={saving}>
              {saving ? '저장 중…' : '저장'}
            </button>
          </div>
        </div>
      );
    }

    // ──────────────── 기록 상세 바텀시트 ────────────────
    function RecordDetailSheet({ record, name, today, onClose }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);
      return (
        <div className="sheet-overlay" onClick={onClose}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-header">
              <h3>{fmtKDate(record.date)}{name ? ' · ' + name : ''}</h3>
              <button className="sheet-close" onClick={onClose} aria-label="닫기">✕</button>
            </div>
            <div className="sheet-body">
              <div className="detail-field">
                <div className="df-label"><span className="df-dot" style={{background:'var(--dev-read)'}} /> 말씀 읽음</div>
                <div className={'df-value' + (record.wordRead ? '' : ' muted')}>{record.wordRead ? '읽음 ✓' : '기록 없음'}</div>
              </div>
              <div className="detail-field">
                <div className="df-label"><span className="df-dot" style={{background:'var(--dev-verse)'}} /> 와닿은 말씀</div>
                <div className={'df-value' + (record.verse ? '' : ' muted')}>{record.verse || '기록 없음'}</div>
              </div>
              <div className="detail-field">
                <div className="df-label"><span className="df-dot" style={{background:'var(--dev-resolve)'}} /> 결단</div>
                <div className={'df-value' + (record.resolution ? '' : ' muted')}>{record.resolution || '기록 없음'}</div>
              </div>
              <div className="detail-field">
                <div className="df-label"><span className="df-dot" style={{background:'var(--dev-prayer)'}} /> 수련회를 위한 기도</div>
                <div className={'df-value' + (record.retreatPrayer ? '' : ' muted')}>{record.retreatPrayer ? '기도함 ✓' : '기록 없음'}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function RecordCard({ record, today, onClick }) {
      return (
        <button className="record-card" onClick={onClick}>
          <div>
            <div className="record-date">{fmtKDate(record.date)}</div>
            <div className="record-rel">{relativeDate(record.date, today)}</div>
          </div>
          <div className="record-badges">
            <span className={'rbadge read' + (record.wordRead ? ' on' : '')} title="말씀읽음">읽</span>
            <span className={'rbadge verse' + (record.verse ? ' on' : '')} title="와닿은말씀">말</span>
            <span className={'rbadge resolve' + (record.resolution ? ' on' : '')} title="결단">결</span>
            <span className={'rbadge prayer' + (record.retreatPrayer ? ' on' : '')} title="수련회기도">기</span>
          </div>
        </button>
      );
    }

    // ──────────────── MyStatsView ────────────────
    const TONE = {
      praise:    { color: 'var(--dev-read)',   icon: '🎉' },
      nudge:     { color: 'var(--dev-prayer)', icon: '💡' },
      strong:    { color: 'var(--semantic-status-negative)', icon: '🙏' },
      milestone: { color: 'var(--dev-resolve)', icon: '🏆' },
    };

    function MyStatsView({ idToken, me, toast }) {
      const today = todayKST();
      const [rows, setRows] = useState(null);
      const [loading, setLoading] = useState(true);
      const [detail, setDetail] = useState(null);

      useEffect(() => {
        let aborted = false; setLoading(true);
        callApi('getMyRecords', { idToken }).then((r) => {
          if (aborted) return;
          if (r.ok) setRows(r.rows || []); else { toast.show('기록 불러오기 실패'); setRows([]); }
          setLoading(false);
        }).catch(() => { if (!aborted) { toast.show('네트워크 오류'); setRows([]); setLoading(false); } });
        return () => { aborted = true; };
      }, [idToken, toast.show]);

      if (loading || !rows) return <div className="loading">현황 불러오는 중…</div>;

      const streak = DevStats.computeStreak(rows, today);
      const wr = DevStats.weeklyRate(rows, today);
      const mr = DevStats.monthlyRate(rows, today);
      const prayer = DevStats.retreatPrayerCount(rows, today, 7);
      const enc = DevStats.encourageMessage(rows, today);
      const tone = TONE[enc.tone] || TONE.praise;
      const recent = rows.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 30);

      return (
        <div className="view">
          <div className="encourage" style={{'--enc-color': tone.color}}>
            <span className="enc-icon">{tone.icon}</span>
            <span className="enc-text">{enc.text}</span>
          </div>

          <div className="streak-card">
            <span className="streak-flame">{streak > 0 ? '🔥' : '🌱'}</span>
            <div>
              <div className="streak-num">{streak}<span style={{fontSize:16,marginLeft:4}}>일</span></div>
              <div className="streak-label">연속 말씀 읽기</div>
            </div>
          </div>

          <div className="rate-grid">
            <div className="rate-card">
              <div className="rate-title">주간 달성률</div>
              <div className="rate-pct">{wr.pct}%</div>
              <div className="rate-meta">이번 주 {wr.done}/{wr.total}일</div>
              <div className="rate-track"><div className="rate-fill" style={{width: wr.pct + '%'}} /></div>
            </div>
            <div className="rate-card">
              <div className="rate-title">월간 달성률</div>
              <div className="rate-pct">{mr.pct}%</div>
              <div className="rate-meta">이번 달 {mr.done}/{mr.total}일</div>
              <div className="rate-track"><div className="rate-fill" style={{width: mr.pct + '%'}} /></div>
            </div>
          </div>

          <div className="prayer-counter">
            <span style={{fontSize:22}}>🙏</span>
            <div>
              <span className="pc-num">{prayer}</span>
              <span className="pc-label"> / 최근 7일 수련회 기도</span>
            </div>
          </div>

          <div className="section-head">최근 기록</div>
          {recent.length === 0 ? (
            <div className="empty-note">아직 기록이 없어요. ‘오늘’ 탭에서 첫 기록을 남겨보세요.</div>
          ) : (
            recent.map((r) => (
              <RecordCard key={r.date} record={r} today={today} onClick={() => setDetail(r)} />
            ))
          )}

          {detail && <RecordDetailSheet record={detail} today={today} onClose={() => setDetail(null)} />}
        </div>
      );
    }

    // ──────────────── TeamView (teacher/admin) ────────────────
    function TeamView({ idToken, me, toast }) {
      const today = todayKST();
      const [members, setMembers] = useState(null);
      const [rows, setRows] = useState(null);
      const [loading, setLoading] = useState(true);
      const [detailStudent, setDetailStudent] = useState(null); // { email, name }
      const [detailRecord, setDetailRecord] = useState(null);

      useEffect(() => {
        let aborted = false; setLoading(true);
        Promise.all([
          callApi('getMembers', { idToken }),
          callApi('getAllRecords', { idToken }),
        ]).then(([m, a]) => {
          if (aborted) return;
          if (!m.ok) { toast.show('명단 불러오기 실패'); setLoading(false); return; }
          if (!a.ok) toast.show('기록 불러오기 실패');
          setMembers(m.members || []);
          setRows(a.rows || []);
          setLoading(false);
        }).catch(() => { if (!aborted) { toast.show('네트워크 오류'); setLoading(false); } });
        return () => { aborted = true; };
      }, [idToken, toast.show]);

      const last7 = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) days.push(addDays(today, -i));
        return days;
      }, [today]);

      const byEmail = useMemo(() => {
        const map = {};
        (rows || []).forEach((r) => {
          if (!r.email) return;
          (map[r.email] = map[r.email] || []).push(r);
        });
        return map;
      }, [rows]);

      if (loading) return <div className="loading">우리팀 현황 불러오는 중…</div>;
      if (!members || members.length === 0) return <div className="empty-note">등록된 학생이 없습니다.</div>;

      const studentRecords = detailStudent
        ? (byEmail[detailStudent.email] || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1))
        : [];

      return (
        <div className="view">
          <div className="section-head">학생별 최근 7일 · 말씀 읽음 기준</div>
          {members.map((mem) => {
            const mrows = byEmail[mem.email] || [];
            const readSet = {};
            mrows.forEach((r) => { if (r.wordRead) readSet[r.date] = true; });
            const streak = DevStats.computeStreak(mrows, today);
            const wr = DevStats.weeklyRate(mrows, today);
            return (
              <button className="team-card" key={mem.email} onClick={() => setDetailStudent({ email: mem.email, name: mem.name })}>
                <div className="team-top">
                  <span className="team-name">{mem.name}</span>
                  {/* getAllRecords는 후행 60일 윈도우라 그 이상의 연속 기록은 정확한 값을 알 수 없다 */}
                  <span className="team-stat">연속 <b>{streak >= 60 ? '60+' : streak}</b>일 · 주간 {wr.pct}%</span>
                </div>
                <div className="team-week">
                  {last7.map((d) => (
                    <div className="day-cell" key={d}>
                      <span className="day-dow">{DOW[new Date(d + 'T00:00:00Z').getUTCDay()]}</span>
                      <span className={'day-mark' + (readSet[d] ? ' on' : '') + (d === today ? ' today' : '')}>
                        {readSet[d] ? '○' : '×'}
                      </span>
                    </div>
                  ))}
                </div>
              </button>
            );
          })}

          {detailStudent && (
            <div className="sheet-overlay" onClick={() => setDetailStudent(null)}>
              <div className="sheet" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-handle" />
                <div className="sheet-header">
                  <h3>{detailStudent.name}</h3>
                  <button className="sheet-close" onClick={() => setDetailStudent(null)} aria-label="닫기">✕</button>
                </div>
                <div className="sheet-body">
                  {studentRecords.length === 0 ? (
                    <div className="empty-note">기록이 없습니다.</div>
                  ) : (
                    studentRecords.map((r) => (
                      <RecordCard key={r.date} record={r} today={today} onClick={() => setDetailRecord(r)} />
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {detailRecord && (
            <RecordDetailSheet record={detailRecord} name={detailStudent ? detailStudent.name : ''} today={today} onClose={() => setDetailRecord(null)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
